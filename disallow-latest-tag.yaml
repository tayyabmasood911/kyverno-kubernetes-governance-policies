apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices / Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: The ':latest' tag is mutable and makes rollbacks unpredictable.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: validate-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
    validate:
      message: "Images with the ':latest' tag are prohibited in production. Specify an explicit semantic version or digest SHA."
      pattern:
        spec:
          containers:
          - image: "!*:latest"
