apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-cpu-memory-limits
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Limits
    policies.kyverno.io/category: Best Practices / Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Resource requests and limits prevent noisy neighbors and cluster resource starvation.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-limits-and-requests
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
    validate:
      message: "CPU and memory resource requests and limits are mandatory for all containers."
      pattern:
        spec:
          containers:
          - resources:
              requests:
                cpu: "?*"
                memory: "?*"
              limits:
                cpu: "?*"
                memory: "?*"
